name: pipeline
on:
  push:
    branches:
      - main
      - feature/sample
  pull_request:
    branches:
      - main
      - feature/sample
  workflow_dispatch:
    branches:
      - main
      - feature/sample
    inputs:
      deploy_env:
        description: 'target env'
        required: true
        type: choice
        options: 
          - dev 
          - stg 
        default: dev
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    #download the source code
      - name: Checkout code
        uses: actions/checkout@v4
    #setup JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: checking java version
        run: |
         java -version
         mvn -version
    #build the project using maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml
    # Step 5: Upload the generated JAR
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-application
          path: target/*.jar
          
    
  